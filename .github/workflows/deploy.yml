name: Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    name: Build deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/out

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate backend Python
        run: python -m compileall -q backend

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t cyber-analyzer:ci .

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Validate Azure Terraform
        working-directory: terraform/azure
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate GCP Terraform
        working-directory: terraform/gcp
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Deployment status
        run: echo "✅ Build and validation passed. Real cloud deployment is currently disabled."



